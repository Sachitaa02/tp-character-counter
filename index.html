<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Counter</title>

    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playwrite+GB+J+Guides:ital@0;1&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
</head>

<body>

    <main class="container">

        <header class="header">
        <div class="logo">
            Character Counter
        </div>

        <button class="theme-button">
            ⚙
        </button>
        </header>



    <section class="hero">
        <h1>
            Analyze your text in real-time.
        </h1>

        <textarea placeholder="Start typing here..."> 
        </textarea>

        <div class="controls">

        <div class="checkbox-group">

            <label>
                <input type="checkbox">
                Exclude Spaces
            </label>

            <label>
                <input type="checkbox">
                Set Character Limit
            </label>

        </div>

        <p class="reading-time">
            Approx. reading time: &lt;1 minute
        </p>

         </div>
    </section>



    <section class="stats-cards">

        <article class="card purple-card">

            <h2>278</h2>

            <p>Total Characters</p>

        </article>


        <article class="card orange-card">

            <h2>39</h2>

            <p>Word Count</p>

        </article>


        <article class="card coral-card">

            <h2>12</h2>

            <p>Sentence Count</p>

        </article>

    </section>


    <section class="letter-density">

        <h3>Letter Density</h3>

        <div class="density-item">

            <div class="letter-info">
                <span class="letter">E</span>
            </div>

            <div class="progress-bar">

                <div class="progress-fill fill-e"></div>
            </div>

            <div class="letter-stats">
                <span>40%</span>
                <span>112</span>
            </div>

        </div>


        <div class="density-item">

            <div class="letter-info">
                <span class="letter">T</span>
            </div>

            <div class="progress-bar">
                <div class="progress-fill fill-t"></div>
            </div>

            <div class="letter-stats">
                <span>25%</span>
                <span>70</span>
            </div>

        </div>


        <div class="density-item">

            <div class="letter-info">
                <span class="letter">A</span>
            </div>

            <div class="progress-bar">
                <div class="progress-fill fill-a"></div>
            </div>

            <div class="letter-stats">
                <span>18%</span>
                <span>50</span>
            </div>

        </div>


    </section>


    </main>

</body>
</html>
